name = "pencernaan-gratis-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "game-pencernaan-db"
database_id = "eb271ff1-3c70-4412-9bae-e701fb583fe6"

[vars]
# Ganti dengan origin game-mu. Harus sama persis (tanpa garis miring di akhir).
ALLOWED_ORIGIN = "https://destroy27.github.io"
# "1" = papan skor global (top 10) tampil di game, "0" = sembunyikan nama dari publik.
PAPAN_PUBLIK = "1"
